version: 0.2

phases:
  install:
    commands:
      - echo "Creating buildx builder"

      - docker buildx create --use --name multiarch-builder

      - docker buildx inspect --bootstrap

  pre_build:
    commands:
      - echo "Logging into Amazon ECR"

      - aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 721176634889.dkr.ecr.us-west-2.amazonaws.com

  build:
    commands:
      - echo "Building multi-architecture image"

      - docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t 721176634889.dkr.ecr.us-west-2.amazonaws.com/vishnumultiarch-demo:latest \
        --push .
